<!DOCTYPE html>

<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Aviator VIP</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}

body{
  background:#07090d;
  color:#fff;
  font-family:Arial,sans-serif;
  min-height:100vh;
}

button,input,select{font:inherit}
button{cursor:pointer}

header{
  position:sticky;
  top:0;
  z-index:20;
  height:64px;
  background:#10141b;
  border-bottom:1px solid rgba(255,255,255,.08);
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 16px;
}

.logo{
  display:flex;
  align-items:center;
  gap:9px;
  font-weight:900;
  letter-spacing:.5px;
}

.logo-plane{font-size:24px}

.vip{
  background:#ffc400;
  color:#000;
  padding:4px 7px;
  border-radius:5px;
  font-size:10px;
  font-weight:900;
}

.online{
  display:flex;
  align-items:center;
  gap:6px;
  color:#21d47b;
  font-size:11px;
  font-weight:700;
}

.online-dot{
  width:7px;
  height:7px;
  background:#21d47b;
  border-radius:50%;
  box-shadow:0 0 8px #21d47b;
}

nav{
  display:flex;
  justify-content:center;
  gap:5px;
  background:#0d1117;
  padding:8px;
  border-bottom:1px solid rgba(255,255,255,.06);
}

.nav-btn{
  border:0;
  background:transparent;
  color:#9299a6;
  padding:9px 16px;
  border-radius:8px;
  font-size:13px;
  font-weight:700;
}

.nav-btn.active{
  background:#1a2029;
  color:#ffc400;
}

.container{
  width:100%;
  max-width:520px;
  margin:auto;
  padding:18px 14px 40px;
}

.card{
  background:#10141b;
  border:1px solid rgba(255,255,255,.08);
  border-radius:15px;
  padding:18px;
  margin-bottom:14px;
}

.auth-card{margin-top:20px}

.auth-logo{
  text-align:center;
  font-size:54px;
  margin-bottom:5px;
}

h1{
  text-align:center;
  font-size:24px;
  margin-bottom:7px;
}

.subtitle{
  color:#9299a6;
  text-align:center;
  font-size:13px;
  margin-bottom:20px;
}

label{
  display:block;
  color:#9299a6;
  font-size:12px;
  font-weight:700;
  margin-bottom:7px;
}

.input-row{
  display:flex;
  gap:8px;
}

select,input{
  width:100%;
  height:48px;
  background:#151a22;
  border:1px solid rgba(255,255,255,.1);
  color:#fff;
  border-radius:9px;
  padding:0 12px;
  outline:none;
}

select{max-width:125px}

input:focus,select:focus{
  border-color:#ffc400;
}

.primary-btn{
  width:100%;
  height:49px;
  margin-top:13px;
  border:0;
  border-radius:9px;
  background:linear-gradient(135deg,#ffc400,#ff9d00);
  color:#000;
  font-weight:900;
  font-size:14px;
}

.primary-btn:disabled{
  opacity:.55;
  cursor:not-allowed;
}

#recaptcha-container{
  width:100%;
  min-height:78px;
  margin-top:12px;
  display:flex;
  justify-content:center;
  align-items:center;
  overflow:visible;
}

.code-area{
  display:none;
  margin-top:14px;
}

.message{
  margin-top:12px;
  padding:11px;
  border-radius:8px;
  font-size:12px;
  line-height:1.45;
  display:none;
  word-break:break-word;
}

.message.error{
  display:block;
  background:rgba(255,71,87,.1);
  border:1px solid rgba(255,71,87,.25);
  color:#ff7b87;
}

.message.success{
  display:block;
  background:rgba(33,212,123,.1);
  border:1px solid rgba(33,212,123,.25);
  color:#21d47b;
}

.page{display:none}
.page.active{display:block}

.hero{
  background:linear-gradient(135deg,#141922,#0e1218);
  border:1px solid rgba(255,255,255,.08);
  border-radius:15px;
  padding:18px;
  margin-bottom:14px;
}

.hero-top{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:16px;
}

.small-label{
  color:#9299a6;
  font-size:11px;
  text-transform:uppercase;
  letter-spacing:.7px;
}

.balance{
  font-size:26px;
  font-weight:900;
  color:#ffc400;
}

.status{
  color:#21d47b;
  font-size:12px;
  font-weight:800;
}

.signal-box{
  text-align:center;
  padding:20px 10px;
  background:#07090d;
  border-radius:12px;
  border:1px solid rgba(255,196,0,.16);
}

.signal-label{
  color:#9299a6;
  font-size:12px;
  margin-bottom:8px;
}

.signal{
  font-size:58px;
  line-height:1;
  font-weight:900;
  color:#ffc400;
  text-shadow:0 0 22px rgba(255,196,0,.2);
}

.signal-sub{
  margin-top:8px;
  color:#21d47b;
  font-size:12px;
  font-weight:700;
}

.stats{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:8px;
  margin-top:12px;
}

.stat{
  background:#151a22;
  border-radius:9px;
  padding:12px 7px;
  text-align:center;
}

.stat strong{
  display:block;
  font-size:18px;
  margin-bottom:4px;
}

.stat span{
  color:#9299a6;
  font-size:10px;
}

.section-title{
  font-size:15px;
  font-weight:900;
  margin-bottom:11px;
}

.history{
  display:flex;
  flex-wrap:wrap;
  gap:7px;
}

.history-item{
  background:#151a22;
  border-radius:7px;
  padding:7px 9px;
  font-size:12px;
  font-weight:800;
  color:#ffc400;
}

.register-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:9px;
}

.register-btn{
  min-height:58px;
  border:1px solid rgba(255,196,0,.18);
  background:#151a22;
  color:#fff;
  border-radius:10px;
  font-weight:900;
}

.register-btn span{
  display:block;
  color:#9299a6;
  font-size:10px;
  margin-top:4px;
}

.whatsapp{
  width:100%;
  min-height:48px;
  border:0;
  border-radius:9px;
  background:#21d47b;
  color:#001b0e;
  font-weight:900;
}

.warning{
  color:#9299a6;
  font-size:11px;
  line-height:1.5;
  text-align:center;
}

.account-row{
  display:flex;
  justify-content:space-between;
  gap:12px;
  padding:13px 0;
  border-bottom:1px solid rgba(255,255,255,.06);
  font-size:13px;
}

.account-row:last-child{border-bottom:0}

.account-row span{color:#9299a6}

.logout{
  width:100%;
  height:45px;
  margin-top:14px;
  border:1px solid rgba(255,71,87,.3);
  background:rgba(255,71,87,.08);
  color:#ff6d79;
  border-radius:9px;
  font-weight:800;
}

.loading{
  display:none;
  text-align:center;
  color:#9299a6;
  font-size:12px;
  margin-top:10px;
}

footer{
  text-align:center;
  color:#555d69;
  font-size:10px;
  padding:10px 0 25px;
}

@media(max-width:380px){
  .container{
    padding-left:10px;
    padding-right:10px;
  }

  .signal{font-size:50px}

  .nav-btn{padding:9px 11px}
}
</style>

</head>
